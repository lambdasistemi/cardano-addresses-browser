name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-and-build:
    runs-on: nixos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: nix develop -c npm ci

      - name: Check formatting
        run: nix develop -c just check

      - name: Build
        run: nix develop -c just build

      - name: Haskell quality
        run: nix develop -c just haskell-quality

      - name: Check vectors
        run: nix develop -c just check-vectors

      - name: Run tests
        run: nix develop -c just test

      - name: Run Playwright UI tests
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$(nix eval --impure --raw --expr 'let flake = builtins.getFlake (toString ./.); pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; overlays = [ flake.inputs.haskellNix.overlay flake.inputs.purescript-overlay.overlays.default ]; }; in pkgs.playwright-driver.browsers')"
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          nix develop -c just test-playwright
