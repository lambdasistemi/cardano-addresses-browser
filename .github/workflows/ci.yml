name: CI

on:
  push:
    branches:
      - main
      - 001-cardano-addr-web
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: just check

      - name: Build
        run: just build
