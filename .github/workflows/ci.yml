name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v15

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: just check

      - name: Build
        run: just build

      - name: Check vectors
        run: just check-vectors

      - name: Run tests
        run: just test
